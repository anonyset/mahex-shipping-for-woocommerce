name: Publish WordPress update channel
on:
  push:
    branches: [main]
    paths:
      - 'mahex-shipping-for-woocommerce.php'
      - 'src/**'
      - 'assets/**'
      - 'readme.txt'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'update.json'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/publish-update.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wordpress-update-channel
  cancel-in-progress: true
jobs:
  integration:
    uses: ./.github/workflows/integration.yml
  publish:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: zip, simplexml, dom, mbstring, ctype, curl, gd
      - name: Install locked PDF runtime
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
      - name: Validate PHP and manifest
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/dev/null
          VERSION=$(php -r '$c=file_get_contents("mahex-shipping-for-woocommerce.php"); preg_match("/Version:\\s*([^\\r\\n]+)/",$c,$m); echo trim($m[1]??"");')
          MANIFEST=$(php -r '$j=json_decode(file_get_contents("update.json"),true,512,JSON_THROW_ON_ERROR); echo $j["version"]??"";')
          test "$VERSION" = "$MANIFEST"
          for TEST in tests/*-test.php; do php "$TEST"; done
          echo "Publishing version $VERSION"
      - name: Build clean plugin zip
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/mahex-shipping-for-woocommerce
          rsync -a ./ build/mahex-shipping-for-woocommerce/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'docs/' \
            --exclude 'tests/' \
            --exclude 'build/' \
            --exclude 'update.json' \
            --exclude '.gitignore' \
            --exclude 'CONTRIBUTING.md' \
            --exclude 'SECURITY.md' \
            --exclude 'RELEASING.md' \
            --exclude '*.zip' \
            --exclude 'node_modules/'
          cd build
          zip -qr mahex-shipping-for-woocommerce.zip mahex-shipping-for-woocommerce
          cp ../update.json .
          sha256sum mahex-shipping-for-woocommerce.zip > SHA256SUMS.txt
      - name: Publish versioned installable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(php -r '$j=json_decode(file_get_contents("update.json"),true,512,JSON_THROW_ON_ERROR); echo $j["version"];')
          TAG="v$VERSION"
          ASSET="mahex-shipping-for-woocommerce-$VERSION.zip"
          cp build/mahex-shipping-for-woocommerce.zip "build/$ASSET"
          python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath
          with zipfile.ZipFile("build/mahex-shipping-for-woocommerce.zip") as archive:
              assert archive.testzip() is None
              names = archive.namelist()
              assert "mahex-shipping-for-woocommerce/mahex-shipping-for-woocommerce.php" in names
              assert all(PurePosixPath(name).parts[0] == "mahex-shipping-for-woocommerce" and ".." not in PurePosixPath(name).parts for name in names)
          PY
          (cd build && sha256sum "$ASSET" > "$ASSET.sha256")
          cat > build/release-notes.md <<EOF
          ## نصب در وردپرس
          فایل **$ASSET** را از Assets دانلود کنید.
          در وردپرس: افزونه‌ها ← افزودن افزونه ← بارگذاری افزونه ← انتخاب ZIP ← نصب ← فعال‌سازی.
          پوشه افزونه داخل ZIP نام ثابت mahex-shipping-for-woocommerce دارد.
          فایل‌های Source code آرشیو کد هستند؛ برای نصب از فایل بالا استفاده کنید.
          
          Author: Hosein Momeni
          EOF
          if test -f "UPGRADE-$VERSION.md"; then cat "UPGRADE-$VERSION.md" >> build/release-notes.md; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Preserving existing release $TAG"
          else
            gh release create "$TAG" "build/$ASSET" "build/$ASSET.sha256" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Mahex WooCommerce $VERSION" --notes-file build/release-notes.md
          fi
          mkdir -p /tmp/mahex-release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir /tmp/mahex-release
          cp "/tmp/mahex-release/$ASSET" build/mahex-shipping-for-woocommerce.zip
          php -r '$p="build/update.json"; $j=json_decode(file_get_contents($p),true,512,JSON_THROW_ON_ERROR); $j["sha256"]=hash_file("sha256","build/mahex-shipping-for-woocommerce.zip"); $j["download_url"]="https://github.com/".getenv("GITHUB_REPOSITORY")."/releases/download/v".$j["version"]."/mahex-shipping-for-woocommerce-".$j["version"].".zip"; file_put_contents($p,json_encode($j,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE)."\n");'
          (cd build && sha256sum mahex-shipping-for-woocommerce.zip > SHA256SUMS.txt)
      - name: Publish dist branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp -a build /tmp/mahex-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dist-publish
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/mahex-dist/. .
          git add mahex-shipping-for-woocommerce.zip update.json SHA256SUMS.txt
          git commit -m "Publish WordPress update package"
          git push --force origin HEAD:dist
