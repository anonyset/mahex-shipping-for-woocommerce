name: Bug report
about: گزارش باگ / Report a reproducible problem
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 3.0.1
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: مشکل / Problem
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: مراحل بازتولید / Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: WordPress / WooCommerce / PHP
